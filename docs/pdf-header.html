<!-- Print stylesheet for the DOCASA User Manual PDF export (Task 25).
     Passed to pandoc as --include-in-header; it is an HTML partial, so
     the CSS must live inside <style> tags or pandoc prints it as text.
     Chromium headless honors @page when printing to PDF. -->
<style>
@page {
  size: A4;
  margin: 18mm 16mm;
}

html {
  font-size: 10.5pt;
}

body {
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  line-height: 1.45;
  color: #17203a;
  max-width: none;
  margin: 0;
  padding: 0;
}

h1, h2, h3 {
  color: #0b2a4a;
  line-height: 1.25;
}

h1 {
  font-size: 1.75em;
  border-bottom: 2px solid #0b2a4a;
  padding-bottom: 0.2em;
}

h2 {
  font-size: 1.3em;
  margin-top: 1.4em;
}

h3 {
  font-size: 1.1em;
}

h2, h3, h4 {
  break-after: avoid;
}

table {
  border-collapse: collapse;
  width: 100%;
  margin: 0.6em 0 0.9em;
  font-size: 0.94em;
}

th, td {
  border: 1px solid #9db4c8;
  padding: 4px 8px;
  text-align: left;
  vertical-align: top;
}

th {
  background: #eef3f7;
}

blockquote {
  background: #f3f6fa;
  border-left: 4px solid #4a90d9;
  margin: 0.8em 0;
  padding: 0.5em 0.9em;
  color: #33415c;
}

code {
  font-family: Consolas, "Cascadia Code", monospace;
  font-size: 0.92em;
  background: #f1f3f6;
  padding: 1px 4px;
  border-radius: 3px;
}

pre {
  background: #f7f8fa;
  border: 1px solid #d9e1ea;
  padding: 8px 10px;
  break-inside: avoid;
}

li {
  margin: 2px 0;
}

hr {
  border: none;
  border-top: 1px solid #c9d4e0;
  margin: 1.1em 0;
}

#TOC {
  break-after: page;
  font-size: 0.95em;
}

#TOC ul {
  list-style: none;
  padding-left: 1.1em;
}

#TOC > ul {
  padding-left: 0;
}

#TOC a {
  text-decoration: none;
  color: #17203a;
}
</style>
